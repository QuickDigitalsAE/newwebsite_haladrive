name: Core PHP Deploy

on:
  push:
    branches:
      - main
      - azhar

jobs:
  deploy-to-cpanel:
    name: Deploy to cPanel
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 2️⃣ Deploy via FTP
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}       # cPanel FTP server
          username: ${{ secrets.FTP_USERNAME }} # FTP username
          password: ${{ secrets.FTP_PASSWORD }} # FTP password
          server-dir: ./                        # Remote folder in cPanel
          local-dir: ./                         # Local project folder
          port: 21
          protocol: ftp
          dry-run: false

      # 3️⃣ Done
      - name: Deployment Complete
        run: echo "✅ Project deployed to cPanel from branch ${{ github.ref_name }}!"