name: Core PHP Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy-to-cpanel:
    name: Deploy to cPanel
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      # 1️⃣ Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 2️⃣ Deploy via FTP
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}       # cPanel FTP server
          username: ${{ secrets.FTP_USERNAME }} # FTP username
          password: ${{ secrets.FTP_PASSWORD }} # FTP password
          server-dir: ./ # Remote folder in cPanel
          local-dir: ./                         # Local project folder
          port: 21
          protocol: ftp
          dry-run: false
          git-ftp-args: --insecure             # optional for insecure SSL

      # 3️⃣ Done
      - name: Deployment Complete
        run: echo "✅ Core PHP project deployed to cPanel!"
